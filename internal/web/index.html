<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Little SFU</title>
  </head>
  <body>
    <h1>Little SFU</h1>
    <p>The server is running.</p>

    <button id="publish">Publish</button>

    <script>
      // wait for ice gathering helper function
      function waitForIceGathering(peerConnection) {
        if (peerConnection.iceGatheringState === "complete") {
          return Promise.resolve();
        }

        return new Promise((resolve) => {
          function handleStateChange() {
            if (peerConnection.iceGatheringState === "complete") {
              peerConnection.removeEventListener(
                "icegatheringstatechange",
                handleStateChange,
              );

              resolve();
            }
          }

          peerConnection.addEventListener("icegatheringstatechange", handleStateChange);
        });
      }

      // publish button handler
      document.querySelector("#publish").addEventListener("click", async () => {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: true,
        });

        const peerConnection = new RTCPeerConnection();

        for (const track of stream.getTracks()) {
          peerConnection.addTrack(track, stream);
        }

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await waitForIceGathering(peerConnection);

        console.log(peerConnection.localDescription);

        const roomID = new URLSearchParams(location.search).get("room") || "demo";
        const body = JSON.stringify(peerConnection.localDescription)
        
        const res = await fetch(`/publish/${roomID}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const data = await res.json();
        await peerConnection.setRemoteDescription(data);
      });
    </script>
  </body>
</html>
