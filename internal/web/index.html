<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Little SFU</title>
  </head>
  <body>
    <h1>Little SFU</h1>
    <p>The server is running.</p>

    <button id="join">Join</button>
    <button id="watch">Watch</button>
    <video id="remote-video" autoplay playsinline controls></video>

    <script type="module">
      import { createOfferHandler } from "/signaling.mjs";

      // wait for ice gathering helper function
      function waitForIceGathering(peerConnection) {
        if (peerConnection.iceGatheringState === "complete") {
          return Promise.resolve();
        }

        return new Promise((resolve) => {
          function handleStateChange() {
            if (peerConnection.iceGatheringState === "complete") {
              peerConnection.removeEventListener(
                "icegatheringstatechange",
                handleStateChange,
              );

              resolve();
            }
          }

          peerConnection.addEventListener("icegatheringstatechange", handleStateChange);
        });
      }

      // join button handler
      const joinButton = document.querySelector("#join");

      joinButton.addEventListener("click", async () => {
        joinButton.disabled = true;
        
        let stream;
        let peerConnection;
        let socket;

        function cleanup() {
          if (socket) {
            socket.onclose = null;
            socket.close();
          }

          peerConnection?.close();
          stream?.getTracks().forEach((track) => track.stop());

          joinButton.disabled = false;
        }

        function fail(error) {
          console.error("Join failed:", error);
          cleanup()
        }
        
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: true,
        });

        peerConnection = new RTCPeerConnection();

        for (const track of stream.getTracks()) {
          peerConnection.addTrack(track, stream);
        }

        const roomID = new URLSearchParams(location.search).get("room") || "demo";

        const url = new URL(`/join/${encodeURIComponent(roomID)}`, location.href);
        url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(url);

        const handleOffer = createOfferHandler({
          pc: peerConnection,
          waitForIceGathering,
          sendAnswer(answer) {
            if (socket.readyState != WebSocket.OPEN) {
              throw new Error("Signaling connection is closed");
            }

            socket.send(JSON.stringify(answer));
          },
        });

        socket.onmessage = async (event) => {
          try {
            const offer = JSON.parse(event.data);

            if (offer.type !== "offer") {
              throw new Error(`Expected offer, received ${offer.type}`);
            }

            await handleOffer(offer);
          } catch (error) {
            fail(error);
          }
        };

        socket.onerror = () => fail(new Error("WebSocket connection failed"));
        socket.onclose = cleanup;
      } catch (error) {
        fail(error);
      }
    });

      // watch button handler
      document.querySelector("#watch").addEventListener("click", async () => {
        // init new peer connection for viewer
        const peerConnection = new RTCPeerConnection();

        // add video and audio transceivers
        peerConnection.addTransceiver("audio", { direction: "recvonly" });
        peerConnection.addTransceiver("video", { direction: "recvonly" });

        peerConnection.ontrack = (event) => {
          document.querySelector("#remote-video").srcObject = event.streams[0];
        };

        // Create viewer's SDP offer and wait for ICE gathering
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await waitForIceGathering(peerConnection);

        console.log(peerConnection.localDescription);

        const roomID = new URLSearchParams(location.search).get("room") || "demo";
        const body = JSON.stringify(peerConnection.localDescription)
        
        const res = await fetch(`/watch/${roomID}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const data = await res.json();
        await peerConnection.setRemoteDescription(data);
      });
    </script>
  </body>
</html>
